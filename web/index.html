<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout · Sandbox Shop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/">Sandbox Shop</a>
      <nav>
        <a href="/" aria-current="page">Checkout</a>
        <a href="/recorder.html">Voice note</a>
      </nav>
    </header>
    <main class="page">
      <h1 id="heading">Checkout</h1>
      <section aria-labelledby="cart-title">
        <h2 id="cart-title">Your cart</h2>
        <ul class="lines" id="lines"></ul>
      </section>
      <form class="shipping" id="shipping" aria-labelledby="shipping-title">
        <h2 id="shipping-title">Shipping</h2>
        <label>Full name <input name="name" autocomplete="name" required /></label>
        <label>Street and number <input name="street" autocomplete="street-address" required /></label>
        <label>CEP <input name="cep" inputmode="numeric" autocomplete="postal-code" pattern="\d{5}-?\d{3}" required /></label>
        <fieldset class="delivery">
          <legend>Delivery</legend>
          <label class="option">
            <input type="radio" name="method" value="standard" checked />
            <span class="option-name">Standard</span>
            <span class="option-window" id="standard-window"></span>
            <span class="price" id="standard-price"></span>
          </label>
          <label class="option">
            <input type="radio" name="method" value="express" />
            <span class="option-name">Express</span>
            <span class="option-window" id="express-window"></span>
            <span class="price" id="express-price"></span>
          </label>
          <label class="option">
            <input type="radio" name="method" value="scheduled" />
            <span class="option-name">Scheduled</span>
            <span class="option-window" id="scheduled-window"></span>
            <span class="price" id="scheduled-price"></span>
          </label>
        </fieldset>
        <label>Delivery date <input id="delivery-date" name="deliveryDate" type="date" aria-describedby="date-error" disabled /></label>
        <p class="field-error" id="date-error" aria-live="polite"></p>
      </form>
      <form class="coupon" id="coupon" aria-labelledby="coupon-title">
        <h2 id="coupon-title">Discount coupon</h2>
        <label>Coupon code <input id="coupon-code" name="code" autocomplete="off" required /></label>
        <button type="submit">Apply</button>
        <p class="coupon-error" id="coupon-error" role="alert"></p>
      </form>
      <section aria-labelledby="loyalty-title">
        <h2 id="loyalty-title">Loyalty points</h2>
        <p id="points-balance"></p>
        <button type="button" id="redeem-points">Redeem points</button>
        <p id="points-earned" hidden></p>
      </section>
      <div class="actions">
        <div class="summary">
          <p class="discount" id="discount" hidden></p>
          <p class="total" id="total"></p>
          <p class="free-shipping" id="free-shipping"></p>
        </div>
        <button class="pay" id="pay" type="submit" form="shipping"></button>
      </div>
      <p class="placed" id="placed" role="status"></p>
      <p class="captured" id="delivery-details" hidden></p>
    </main>
    <script type="module" src="./checkout.ts"></script>
  </body>
</html>
