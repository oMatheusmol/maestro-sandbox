<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout · Sandbox Shop</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/">Sandbox Shop</a>
      <nav>
        <a href="/" aria-current="page">Checkout</a>
        <a href="/recorder.html">Voice note</a>
      </nav>
    </header>
    <main class="page">
      <h1>Checkout</h1>
      <section aria-labelledby="cart-title">
        <h2 id="cart-title">Your cart</h2>
        <ul class="lines" id="lines"></ul>
      </section>
      <form class="shipping" id="shipping" aria-labelledby="shipping-title">
        <h2 id="shipping-title">Shipping</h2>
        <label>Full name <input name="name" autocomplete="name" required /></label>
        <label>Street and number <input name="street" autocomplete="street-address" required /></label>
        <label>CEP <input name="cep" inputmode="numeric" autocomplete="postal-code" pattern="\d{5}-?\d{3}" required /></label>
      </form>
      <div class="actions">
        <p class="total" id="total"></p>
        <button class="pay" id="pay" type="submit" form="shipping"></button>
      </div>
      <p class="placed" id="placed" role="status"></p>
    </main>
    <script type="module" src="./checkout.ts"></script>
  </body>
</html>
